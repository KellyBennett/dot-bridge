name: Offline Go core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify generated queries
        run: |
          make generate
          git diff --exit-code -- internal/store
      - run: go vet ./...
      - run: go test -race ./...
